<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ed8778"/>
      <stop offset="100%" stop-color="#cc4030"/>
    </linearGradient>
    <linearGradient id="bggrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="30%">
      <stop offset="0%" stop-color="#e05d4d" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e05d4d" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="arm">
      <rect x="-70" y="-110" width="140" height="50" rx="6"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bggrad)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <!-- Top accent line -->
  <rect width="1280" height="3" fill="url(#g)"/>
  <!-- Clapperboard icon centered -->
  <g transform="translate(640,240)">
    <!-- Body -->
    <rect x="-70" y="-56" width="140" height="112" rx="12" fill="url(#g)"/>
    <!-- Clapper arm -->
    <rect x="-70" y="-110" width="140" height="50" rx="6" fill="url(#g)" transform="rotate(-5, 0, -56)"/>
    <!-- Stripes -->
    <g transform="rotate(-5, 0, -56)" opacity="0.3">
      <rect x="-58" y="-120" width="18" height="70" fill="#0f0f0f" transform="skewX(-18)"/>
      <rect x="-22" y="-120" width="18" height="70" fill="#0f0f0f" transform="skewX(-18)"/>
      <rect x="14" y="-120" width="18" height="70" fill="#0f0f0f" transform="skewX(-18)"/>
      <rect x="50" y="-120" width="18" height="70" fill="#0f0f0f" transform="skewX(-18)"/>
    </g>
    <!-- Hinge -->
    <rect x="-70" y="-60" width="140" height="5" rx="2.5" fill="#ab3325"/>
    <!-- Screen -->
    <rect x="-58" y="-42" width="116" height="88" rx="6" fill="#0f0f0f"/>
    <!-- Play button -->
    <polygon points="-16,-20 -16,20 20,0" fill="#e5e5e5" opacity="0.9"/>
  </g>
  <!-- Theatarr text -->
  <text x="640" y="400" font-family="'Segoe UI',system-ui,sans-serif" font-size="64" font-weight="700" fill="#e5e5e5" text-anchor="middle" letter-spacing="-1">Theatarr</text>
  <!-- Tagline -->
  <text x="640" y="445" font-family="'Segoe UI',system-ui,sans-serif" font-size="22" fill="#737373" text-anchor="middle" letter-spacing="3" font-weight="400">HOME CINEMA ORCHESTRATION</text>
  <!-- Bottom accent line -->
  <rect y="637" width="1280" height="3" fill="url(#g)"/>
</svg>
