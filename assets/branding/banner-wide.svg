<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ed8778"/>
      <stop offset="100%" stop-color="#cc4030"/>
    </linearGradient>
    <linearGradient id="bggrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#e05d4d" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#e05d4d" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bggrad)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <!-- Top accent line -->
  <rect width="1280" height="3" fill="url(#g)"/>
  <!-- Clapperboard icon -->
  <g transform="translate(510,160)">
    <!-- Body -->
    <rect x="-48" y="-36" width="96" height="76" rx="8" fill="url(#g)"/>
    <!-- Clapper arm -->
    <rect x="-48" y="-72" width="96" height="34" rx="4" fill="url(#g)" transform="rotate(-5, 0, -36)"/>
    <!-- Stripes -->
    <g transform="rotate(-5, 0, -36)" opacity="0.3">
      <rect x="-38" y="-80" width="12" height="48" fill="#0f0f0f" transform="skewX(-18)"/>
      <rect x="-14" y="-80" width="12" height="48" fill="#0f0f0f" transform="skewX(-18)"/>
      <rect x="10" y="-80" width="12" height="48" fill="#0f0f0f" transform="skewX(-18)"/>
      <rect x="34" y="-80" width="12" height="48" fill="#0f0f0f" transform="skewX(-18)"/>
    </g>
    <!-- Hinge -->
    <rect x="-48" y="-39" width="96" height="4" rx="2" fill="#ab3325"/>
    <!-- Screen -->
    <rect x="-38" y="-26" width="76" height="58" rx="4" fill="#0f0f0f"/>
    <!-- Play button -->
    <polygon points="-10,-14 -10,14 14,0" fill="#e5e5e5" opacity="0.9"/>
  </g>
  <!-- Text -->
  <text x="596" y="145" font-family="'Segoe UI',system-ui,sans-serif" font-size="56" font-weight="700" fill="#e5e5e5" letter-spacing="-1">Theatarr</text>
  <!-- Tagline -->
  <text x="596" y="186" font-family="'Segoe UI',system-ui,sans-serif" font-size="18" fill="#737373" letter-spacing="2" font-weight="400">HOME CINEMA ORCHESTRATION</text>
  <!-- Bottom accent line -->
  <rect y="317" width="1280" height="3" fill="url(#g)"/>
</svg>
