<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ed8778"/>
      <stop offset="100%" stop-color="#cc4030"/>
    </linearGradient>
    <clipPath id="arm">
      <rect x="40" y="24" width="432" height="120" rx="16"/>
    </clipPath>
  </defs>
  <!-- Clapperboard body -->
  <rect x="40" y="148" width="432" height="340" rx="32" fill="url(#g)"/>
  <!-- Clapper arm (top piece, slightly open) -->
  <rect x="40" y="24" width="432" height="120" rx="16" fill="url(#g)" transform="rotate(-6, 256, 144)"/>
  <!-- Stripes on clapper arm -->
  <g transform="rotate(-6, 256, 144)" clip-path="url(#arm)" opacity="0.3">
    <rect x="60" y="0" width="56" height="180" fill="#0f0f0f" transform="skewX(-20)"/>
    <rect x="170" y="0" width="56" height="180" fill="#0f0f0f" transform="skewX(-20)"/>
    <rect x="280" y="0" width="56" height="180" fill="#0f0f0f" transform="skewX(-20)"/>
    <rect x="390" y="0" width="56" height="180" fill="#0f0f0f" transform="skewX(-20)"/>
  </g>
  <!-- Hinge line -->
  <rect x="40" y="144" width="432" height="12" rx="6" fill="#ab3325"/>
  <!-- Screen area (dark) -->
  <rect x="72" y="184" width="368" height="272" rx="16" fill="#0f0f0f"/>
  <!-- Play button -->
  <polygon points="196,248 196,392 336,320" fill="#e5e5e5" opacity="0.9"/>
</svg>
