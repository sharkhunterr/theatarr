<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ed8778"/>
      <stop offset="100%" stop-color="#cc4030"/>
    </linearGradient>
    <clipPath id="bg">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <clipPath id="arm">
      <rect x="40" y="24" width="432" height="120" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#bg)">
    <!-- Dark background -->
    <rect width="512" height="512" fill="#0f0f0f"/>
    <!-- Clapperboard body -->
    <rect x="56" y="188" width="400" height="280" rx="24" fill="url(#g)"/>
    <!-- Clapper arm -->
    <rect x="56" y="80" width="400" height="104" rx="14" fill="url(#g)" transform="rotate(-5, 256, 184)"/>
    <!-- Stripes -->
    <g transform="rotate(-5, 256, 184)" opacity="0.3">
      <rect x="76" y="56" width="48" height="150" fill="#0f0f0f" transform="skewX(-18)"/>
      <rect x="176" y="56" width="48" height="150" fill="#0f0f0f" transform="skewX(-18)"/>
      <rect x="276" y="56" width="48" height="150" fill="#0f0f0f" transform="skewX(-18)"/>
      <rect x="376" y="56" width="48" height="150" fill="#0f0f0f" transform="skewX(-18)"/>
    </g>
    <!-- Hinge -->
    <rect x="56" y="184" width="400" height="10" rx="5" fill="#ab3325"/>
    <!-- Screen -->
    <rect x="84" y="218" width="344" height="224" rx="12" fill="#0f0f0f"/>
    <!-- Play button -->
    <polygon points="210,268 210,392 324,330" fill="#e5e5e5" opacity="0.9"/>
  </g>
</svg>
