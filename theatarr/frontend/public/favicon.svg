<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ed8778;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cc4030;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Film reel base -->
  <circle cx="50" cy="50" r="45" fill="url(#grad)" />
  <!-- Inner circle -->
  <circle cx="50" cy="50" r="35" fill="#0f0f0f" />
  <!-- Center circle -->
  <circle cx="50" cy="50" r="12" fill="url(#grad)" />
  <!-- Film perforations -->
  <circle cx="50" cy="20" r="6" fill="#0f0f0f" />
  <circle cx="50" cy="80" r="6" fill="#0f0f0f" />
  <circle cx="20" cy="50" r="6" fill="#0f0f0f" />
  <circle cx="80" cy="50" r="6" fill="#0f0f0f" />
  <!-- T letter -->
  <text x="50" y="58" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#e5e5e5" text-anchor="middle">T</text>
</svg>
