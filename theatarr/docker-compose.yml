version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: theatarr-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/theatarr.db}
      - SECRET_KEY=${SECRET_KEY:?Secret key is required}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - TMDB_API_KEY=${TMDB_API_KEY:-}
      - DATA_PATH=/data
      - TRAILER_PATH=/data/trailers
      - DEBUG=${DEBUG:-false}
    volumes:
      - theatarr-data:/data
      - ./backend/src:/app/src:ro  # Dev: hot reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - theatarr-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
    container_name: theatarr-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - theatarr-network

volumes:
  theatarr-data:
    driver: local

networks:
  theatarr-network:
    driver: bridge
